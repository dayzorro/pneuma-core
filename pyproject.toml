[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pneuma-core"
version = "0.1.0"
description = "AI character engine core - personality, emotion, memory, and goals"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Kyohei" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Framework :: AsyncIO",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "aiosqlite>=0.20",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.50"]
# 联网检索（博查 AI Search）与认知提炼
search = ["httpx>=0.27"]
server = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27"]
all = [
    "anthropic>=0.40",
    "openai>=1.50",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.9",
    "anthropic>=0.40",
    "openai>=1.50",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
pneuma-server = "pneuma_core.server.__main__:main"

[project.urls]
Homepage = "https://github.com/mizkun/pneuma-core"
Repository = "https://github.com/mizkun/pneuma-core"
"Bug Tracker" = "https://github.com/mizkun/pneuma-core/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pneuma_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
src = ["src"]
